# 개발 스택 전용 게이트웨이 설정 (docker-compose.dev.yml의 gateway-dev가 마운트)
# 운영 conf.d/default.conf와 라우팅 규칙은 동일하고, upstream만 -dev 컨테이너로 교체.
upstream fastapi {
    server nl-lib-dev-fastapi:8000;
}

upstream nuxt {
    server nl-lib-dev-nuxt:3000;
}

server {
    listen 80;
    server_name _;

    # 헬스체크
    location /health {
        proxy_pass http://fastapi/health;
    }

    # ── 관리자 API 외부 차단 ───────────────────────────────
    # /api/admin 은 library_catalog 를 통째로 지우는 DELETE 를 포함하는데
    # 인증이 없다. 2026-09-14 카탈로그 전체 유실 이후 외부 노출을 차단한다.
    # 관리 작업은 서버 내부에서 컨테이너로 직접 호출할 것:
    #   docker exec nl-lib-fastapi curl -s localhost:8000/api/admin/status
    # 접두 매칭은 최장 일치가 이기므로 이 블록이 location /api/ 보다 우선한다.
    # (^~ 는 정규식 location 이 나중에 추가돼도 뒤집히지 않게 못박는 용도)
    location ^~ /api/admin {
        deny all;
    }

    # FastAPI (REST API)
    location /api/ {
        proxy_pass         http://fastapi;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Swagger UI / OpenAPI 스키마 — 외부 차단
    # 공개 시 /api/admin 의 DELETE 를 버튼 한 번으로 호출할 수 있다.
    location = /docs {
        deny all;
    }

    location = /openapi.json {
        deny all;
    }

    # Nuxt (프론트엔드) — 나머지 전부
    location / {
        proxy_pass         http://nuxt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;

        # Nuxt HMR (개발 시 WebSocket) — 개발 스택은 실제 dev 서버라 필수
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
