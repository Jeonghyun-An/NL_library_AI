upstream fastapi {
    server fastapi:8000;
}

upstream nuxt {
    server nuxt:3000;
}

server {
    listen 80;
    server_name _;

    # FastAPI (REST API)
    location /api/ {
        proxy_pass         http://fastapi/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # FastAPI 자동생성 문서 (Swagger UI / OpenAPI 스키마)
    location /docs {
        proxy_pass http://fastapi/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://fastapi/openapi.json;
        proxy_set_header Host $host;
    }

    # 헬스체크
    location /health {
        proxy_pass http://fastapi/health;
        proxy_set_header Host $host;
    }

    # Nuxt (프론트엔드) — 나머지 전부
    location / {
        proxy_pass         http://nuxt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Nuxt HMR(개발 시 WebSocket)에 필요 — 배포본엔 현재 빠져있어 프로덕션 빌드에선
        # 문제 없지만, 이 게이트웨이로 개발 모드를 서빙할 일이 생기면 필요해짐.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}