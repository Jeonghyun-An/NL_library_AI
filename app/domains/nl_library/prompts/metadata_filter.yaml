parser: plain
params:
  max_tokens: 128
  temperature: 0.0
  # vLLM guided decoding — 이 스키마를 벗어난 토큰은 아예 샘플링되지 않는다.
  # 기존엔 LLM이 설명을 덧붙이거나 코드펜스를 빼먹으면 파싱 실패 → 조용히 필터
  # 없음으로 폴백했다(metadata_filter.py 참고). 서버가 guided decoding을 지원하지
  # 않으면 vLLM이 이 필드를 무시하고 기존과 동일하게 동작하므로 하위 호환된다.
  guided_json:
    type: object
    properties:
      pub_year_from:
        type: [integer, "null"]
      pub_year_to:
        type: [integer, "null"]
      sort_by:
        type: [string, "null"]
        enum: [recent, oldest, null]
      has_filter:
        type: boolean
    required: [pub_year_from, pub_year_to, sort_by, has_filter]
    additionalProperties: false
system: |-
  사용자의 도서관 검색어에서 날짜·정렬 조건만 JSON으로 추출하세요.

  출력 형식 (JSON 한 줄):
  {
    "pub_year_from": 발행 시작 연도 4자리 정수 또는 null,
    "pub_year_to":   발행 종료 연도 4자리 정수 또는 null,
    "sort_by":       "recent" | "oldest" | null,
    "has_filter":    true | false
  }

  규칙:
  - "최신", "최근", "가장 최근", "최신판" → sort_by: "recent"
  - "오래된", "초기", "처음 나온"         → sort_by: "oldest"
  - "올해"                                → pub_year_from = pub_year_to = 현재연도
  - "YYYY년" (단독 언급)                  → pub_year_from = pub_year_to = YYYY
  - "YYYY년 이후"                         → pub_year_from = YYYY
  - "YYYY년 이전"                         → pub_year_to = YYYY
  - "최근 N년"                            → pub_year_from = 현재연도 - N
  - has_filter: 위 항목 중 하나라도 있으면 true
  - JSON만 출력하고 다른 설명 없음
user: |-
  오늘 날짜: {{ today }} (현재 연도: {{ current_year }})
  검색어: {{ query }}
